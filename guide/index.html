<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guide • PromptForge</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="brand__link" href="../index.html">PromptForge</a>
      <span class="brand__tag">Guide</span>
    </div>

    <nav class="topnav">
      <a class="active" href="../guide/index.html">Guide</a>
      <a href="../wizard/index.html">Build Wizard</a>
      <a href="../library/index.html">Prompt Library</a>
      <a href="../templates/index.html">Templates</a>
    </nav>

    <div class="topbar__actions">
      <input class="search" id="searchInput" placeholder="Search prompts..." />
      <button class="btn btn--ghost" id="themeToggle" type="button">Theme</button>
    </div>
  </header>

  <main class="layout3">
    <aside class="sidebar">
      <div class="sidebar__title">Phases</div>
      <div id="navPhases" class="nav"></div>
      <div class="sidebar__divider"></div>
      <div class="sidebar__title">Bookmarks</div>
      <div id="navBookmarks" class="nav nav--muted"></div>
    </aside>

    <section class="content">
      <div id="promptHeader" class="content__header"></div>
      <div class="content__actions">
        <button class="btn btn--primary" id="copyPrompt" type="button">Copy prompt</button>
        <button class="btn" id="bookmarkPrompt" type="button">Bookmark</button>
        <button class="btn btn--ghost" id="markDone" type="button">Mark done</button>
      </div>

      <div id="promptMeta" class="meta"></div>

      <pre class="code"><code id="promptText"></code></pre>

      <div class="card">
        <h3>Why this prompt exists</h3>
        <p id="promptWhy" class="muted"></p>
      </div>

      <div class="card">
        <h3>Your notes</h3>
        <textarea id="promptNotes" class="textarea" placeholder="What happened when you used this prompt? What will you try next?"></textarea>
        <div class="row">
          <button class="btn btn--primary" id="saveNotes" type="button">Save notes</button>
          <span class="muted" id="notesStatus"></span>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel__title">Project Profile</div>
      <p class="muted small">Used to auto-fill placeholders across prompts.</p>

      <div class="form">
        <label>Project idea <input id="pfIdea" /></label>
        <label>Target users <input id="pfUsers" /></label>
        <label>Problem <input id="pfProblem" /></label>
        <label>Constraints <input id="pfConstraints" /></label>
        <label>Success metric <input id="pfMetric" /></label>
        <div class="row">
          <button class="btn btn--primary" id="saveProfile" type="button">Save</button>
          <button class="btn btn--ghost" id="clearProfile" type="button">Clear</button>
        </div>
      </div>

      <div class="panel__divider"></div>

      <div class="panel__title">Customize prompt</div>
      <p class="muted small">Overrides are optional. Leave blank to use your profile.</p>
      <div class="form">
        <label>Feature 1 <input id="ovFeature1" placeholder="MAIN FEATURE 1" /></label>
        <label>Feature 2 <input id="ovFeature2" placeholder="MAIN FEATURE 2" /></label>
        <label>Feature 3 <input id="ovFeature3" placeholder="MAIN FEATURE 3" /></label>
        <button class="btn" id="applyOverrides" type="button">Apply</button>
      </div>
    </aside>
  </main>

  <script type="module" src="../assets/js/common.js"></script>
  <script type="module" src="../assets/js/pages/guide.js"></script>
</body>
</html>
